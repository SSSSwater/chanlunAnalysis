services:
  - type: web
    name: chanlun-analysis-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_prod.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

  - type: web
    name: chanlun-analysis-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /binance
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
